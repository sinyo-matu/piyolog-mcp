name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  deploy:
    needs: type-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-worker
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Google ログインは任意。未設定の値は Worker に渡さない
      # (wrangler-action は vars / secrets に空の値があると失敗するため)。
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_ALLOWED_DOMAINS: ${{ vars.GOOGLE_ALLOWED_DOMAINS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub secrets
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          PIYOLOG_FEED_URL: ${{ secrets.PIYOLOG_FEED_URL }}
          CHILD_NAME: ${{ secrets.CHILD_NAME }}
        run: |
          missing=
          for key in AUTH_PASSWORD COOKIE_ENCRYPTION_KEY PIYOLOG_FEED_URL CHILD_NAME; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "GitHub Actions secrets が未設定です:$missing"
            echo "gh secret set <NAME> で入れてから workflow を再実行してください。"
            exit 1
          fi
      - name: Upload Google client secret
        if: env.GOOGLE_CLIENT_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$GOOGLE_CLIENT_SECRET" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_SECRET
      - name: Build deploy command
        id: deploy-command
        run: |
          command="deploy --keep-vars"
          for key in GOOGLE_CLIENT_ID GOOGLE_ALLOWED_DOMAINS; do
            eval "value=\${$key}"
            if [ -n "$value" ]; then
              command="$command --var $key:$value"
            fi
          done
          echo "command=$command" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: ${{ steps.deploy-command.outputs.command }}
          secrets: |
            AUTH_PASSWORD
            COOKIE_ENCRYPTION_KEY
            PIYOLOG_FEED_URL
            CHILD_NAME
          vars: |
            AUTH_TTL_SECONDS
        env:
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          PIYOLOG_FEED_URL: ${{ secrets.PIYOLOG_FEED_URL }}
          CHILD_NAME: ${{ secrets.CHILD_NAME }}
          AUTH_TTL_SECONDS: ${{ vars.AUTH_TTL_SECONDS || '15552000' }}
